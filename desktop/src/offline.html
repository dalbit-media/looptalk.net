<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src file:" />
    <title>LoopTalk</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f5f7fa; color: #1f2937; }
      main { text-align: center; padding: 24px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 20px; color: #4b5563; }
      button { border: 0; border-radius: 8px; padding: 10px 20px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>LoopTalk is offline</h1>
      <p>We will reconnect automatically when the network is available.</p>
      <button id="retry" type="button">Try again</button>
    </main>
    <script src="offline.js"></script>
  </body>
</html>
